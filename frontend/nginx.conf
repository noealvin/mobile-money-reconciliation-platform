# =========================
# Nginx — sert le bundle React + reverse-proxy /api -> backend
# =========================
server {
    listen 80;
    server_name _;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # API proxy
    # Tout ce qui commence par /api/ part vers le service Docker `backend`.
    # On retire le préfixe /api avant de transmettre.
    # =========================
    location /api/ {
        proxy_pass         https://mobile-money-reconciliation-platform.onrender.com/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # =========================
    # SPA fallback : toute route inconnue => index.html
    # (sinon /login renvoie 404 au refresh)
    # =========================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
